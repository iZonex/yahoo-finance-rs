name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run instead of publishing"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Confirm tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.+)"/\1/')
          echo "tag=$tag_version  crate=$crate_version"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag $tag_version does not match Cargo.toml version $crate_version"
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish --dry-run
      - name: cargo publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  github-release:
    name: github release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: notes
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          prev_tag=$(git tag --sort=-creatordate | grep -v "^${tag}$" | head -n1 || true)
          if [ -n "$prev_tag" ]; then
            echo "## Changes since $prev_tag" > notes.md
            git log --pretty='format:- %s (%h)' "${prev_tag}..${tag}" >> notes.md
          else
            echo "Initial release." > notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: false
          fail_on_unmatched_files: false
